<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Druva Dipta Memories</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="glass-card">
            <div class="logo-section">
                <div class="logo-circle">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <h1>KENANGAN SMP</h1>
                <p class="subtitle">Kelas 9 - Angkatan 2023/2024</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="username">
                        <i class="fas fa-user"></i> Username
                    </label>
                    <input type="text" id="username" name="username" required placeholder="Masukkan username">
                </div>
                
                <div class="input-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input type="password" id="password" name="password" required placeholder="Masukkan password">
                </div>
                
                <div class="form-options">
                    <label class="checkbox">
                        <input type="checkbox" id="rememberMe">
                        <span>Ingat saya</span>
                    </label>
                </div>
                
                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Masuk
                </button>
                
                <div class="login-footer">
                    <p>Untuk akses, hubungi admin kelas</p>
                    <p class="note">Website Kenangan SMP Kelas 9</p>
                </div>
            </form>
        </div>
        
        <div class="background-options">
            <p class="background-label">Pilih Background:</p>
            <div class="background-thumbnails">
                <div class="thumb active" data-bg="assets/images/backgrounds/default-bg.jpg">
                    <img src="assets/images/backgrounds/default-bg.jpg" alt="Default">
                </div>
                <div class="thumb" data-bg="assets/images/backgrounds/classroom1.jpg">
                    <img src="assets/images/backgrounds/classroom1.jpg" alt="Kelas 1">
                </div>
                <div class="thumb" data-bg="assets/images/backgrounds/classroom2.jpg">
                    <img src="assets/images/backgrounds/classroom2.jpg" alt="Kelas 2">
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script>
        // Inisialisasi background selector
        document.addEventListener('DOMContentLoaded', function() {
            const thumbs = document.querySelectorAll('.background-thumbnails .thumb');
            thumbs.forEach(thumb => {
                thumb.addEventListener('click', function() {
                    // Hapus kelas active dari semua thumbnail
                    thumbs.forEach(t => t.classList.remove('active'));
                    
                    // Tambah kelas active ke thumbnail yang diklik
                    this.classList.add('active');
                    
                    // Ubah background body
                    const bgImage = this.getAttribute('data-bg');
                    document.body.style.backgroundImage = `url('${bgImage}')`;
                });
            });
        });
    </script>
</body>
</html>
